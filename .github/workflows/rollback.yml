# ============================================================================
# Emergency Rollback - Manual trigger only
# ============================================================================

name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - production
          - staging
          - dev
      version:
        description: 'Version to rollback to (leave empty for previous)'
        required: false
        type: string

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Set up Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Get rollback version
        id: rollback
        run: |
          APP="linkflow-${{ github.event.inputs.environment }}"
          
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Get previous release
            PREVIOUS=$(flyctl releases --app $APP --json | jq -r '.[1].ImageRef')
            echo "version=$PREVIOUS" >> $GITHUB_OUTPUT
          fi

      - name: Rollback API
        run: |
          APP="linkflow-${{ github.event.inputs.environment }}"
          flyctl deploy \
            --app $APP \
            --image ${{ steps.rollback.outputs.version }}

      - name: Rollback Worker
        run: |
          APP="linkflow-${{ github.event.inputs.environment }}-worker"
          flyctl deploy \
            --app $APP \
            --image ${{ steps.rollback.outputs.version }}

      - name: Rollback Scheduler
        run: |
          APP="linkflow-${{ github.event.inputs.environment }}-scheduler"
          flyctl deploy \
            --app $APP \
            --image ${{ steps.rollback.outputs.version }}

      - name: Health check
        run: |
          sleep 30
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            curl -sf https://api.linkflow.io/api/v1/health || exit 1
          else
            curl -sf https://${{ github.event.inputs.environment }}-api.linkflow.io/api/v1/health || exit 1
          fi

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '🔄 Rollback ${{ github.event.inputs.environment }} - ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
