# ============================================================================
# Deploy to Production - Manual trigger or on version tag
# ============================================================================

name: Deploy Production

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string

  # Auto-deploy on version tag
  push:
    tags:
      - 'v*.*.*'

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # ======================== PRE-DEPLOY CHECKS ========================
  pre-deploy:
    name: Pre-Deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Build check
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/api
          CGO_ENABLED=0 go build -o /dev/null ./cmd/worker
          CGO_ENABLED=0 go build -o /dev/null ./cmd/scheduler

  # ======================== BACKUP ========================
  backup:
    name: Pre-Deploy Backup
    runs-on: ubuntu-latest
    needs: pre-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create database backup
        run: |
          flyctl ssh console \
            --app linkflow-production \
            -C "pg_dump \$DATABASE_URL | gzip > /tmp/pre-deploy-backup.sql.gz"
          
          # Note: In real setup, upload to S3/R2
          echo "Backup created before deploy"

  # ======================== DEPLOY ========================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deploy, backup]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Run database migrations
        run: |
          flyctl ssh console \
            --app linkflow-production \
            -C "/bin/app migrate up"

      - name: Deploy API (Rolling - Zero Downtime)
        run: |
          flyctl deploy \
            --config deploy/platforms/fly/fly.toml \
            --app linkflow-production \
            --build-arg SERVICE=api \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --remote-only \
            --strategy rolling

      - name: Deploy Worker
        run: |
          flyctl deploy \
            --config deploy/platforms/fly/fly.toml \
            --app linkflow-production-worker \
            --build-arg SERVICE=worker \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --remote-only

      - name: Deploy Scheduler
        run: |
          flyctl deploy \
            --config deploy/platforms/fly/fly.toml \
            --app linkflow-production-scheduler \
            --build-arg SERVICE=scheduler \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --remote-only

      - name: Health check
        run: |
          sleep 30
          curl -sf https://api.linkflow.io/api/v1/health || exit 1

      - name: Smoke tests
        run: |
          # Basic API check
          curl -sf https://api.linkflow.io/api/v1/health | jq .
          
          # Check version
          curl -sf https://api.linkflow.io/api/v1/health | grep -q "ok"

  # ======================== POST-DEPLOY ========================
  post-deploy:
    name: Post-Deploy
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Notify Slack - Success
        if: needs.deploy.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: '🚀 Production deploy successful!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack - Failure
        if: needs.deploy.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: '❌ Production deploy FAILED! Check logs immediately.'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub Release
        if: needs.deploy.result == 'success' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
