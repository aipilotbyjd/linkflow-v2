# =============================================================================
# LinkFlow Development Environment Configuration
# =============================================================================
# Shared development server configuration
# =============================================================================

app:
  name: linkflow
  environment: development
  debug: true
  url: https://dev.linkflow.ai
  frontend_url: https://dev-app.linkflow.ai
  cors_origins:
    - https://dev-app.linkflow.ai
    - http://localhost:3000

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  host: ${DATABASE_HOST}
  port: 5432
  user: ${DATABASE_USER}
  name: linkflow_dev
  sslmode: require
  max_open_conns: 15
  max_idle_conns: 5
  max_lifetime: 15m

redis:
  host: ${REDIS_HOST}
  port: 6379
  db: 0
  pool_size: 10

jwt:
  access_expiry: 30m
  refresh_expiry: 168h
  issuer: linkflow-dev

email:
  provider: sendgrid
  from: noreply@linkflow.ai
  from_name: LinkFlow Dev

storage:
  provider: s3
  s3:
    bucket: linkflow-dev
    region: us-east-1
    use_path_style: false

worker:
  concurrency: 5
  queues:
    - critical
    - default
    - low
  strict_priority: true
  shutdown_timeout: 30s
  health_check_interval: 15s
  retry_limit: 3

scheduler:
  enabled: true
  poll_interval: 10s
  lock_ttl: 30s
  batch_size: 50
  leader_election: true

websocket:
  enabled: true
  ping_interval: 30s
  pong_timeout: 10s
  write_timeout: 10s
  read_buffer_size: 1024
  write_buffer_size: 1024
  max_message_size: 524288

features:
  webhook_stream:
    enabled: true
    max_len: 50000
    batch_size: 10
    max_retries: 3
    consumer_count: 2
  rate_limit:
    enabled: true
    requests_per_minute: 200
    burst_size: 50
  execution:
    default_timeout: 300
    max_retries: 3
    worker_count: 5
    queue_size: 500

metrics:
  enabled: true
  path: /metrics

resilience:
  circuit_breaker:
    enabled: true
    max_requests: 5
    interval: 10s
    timeout: 60s
    failure_threshold: 5
  retry:
    max_attempts: 3
    initial_interval: 100ms
    max_interval: 10s
    multiplier: 2.0
  rate_limit:
    enabled: true
    rate: 200.0
    burst: 50
