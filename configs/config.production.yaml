# =============================================================================
# LinkFlow Production Configuration
# =============================================================================
# Production environment - optimized for performance and security
# ALL secrets MUST be set via environment variables - NEVER commit secrets!
# =============================================================================

app:
  name: linkflow
  environment: production
  debug: false
  # url: set via APP_URL
  # frontend_url: set via APP_FRONTEND_URL
  # secret_key: set via APP_SECRET_KEY
  cors_origins: []  # Set via APP_CORS_ORIGINS

server:
  host: 0.0.0.0
  port: 8090
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  # host: set via DATABASE_HOST
  port: 5432
  # user: set via DATABASE_USER
  # password: set via DATABASE_PASSWORD
  # name: set via DATABASE_NAME
  sslmode: require
  max_open_conns: 50
  max_idle_conns: 10
  max_lifetime: 30m

redis:
  # host: set via REDIS_HOST
  port: 6379
  # password: set via REDIS_PASSWORD
  db: 0
  pool_size: 20

jwt:
  # secret: set via JWT_SECRET (min 64 chars recommended)
  access_expiry: 15m
  refresh_expiry: 168h
  issuer: linkflow

email:
  provider: sendgrid
  from: noreply@linkflow.dev
  from_name: LinkFlow
  # sendgrid_key: set via SENDGRID_KEY

oauth:
  google:
    # client_id: set via OAUTH_GOOGLE_CLIENT_ID
    # client_secret: set via OAUTH_GOOGLE_CLIENT_SECRET
    redirect_url: /api/v1/auth/oauth/google/callback
  github:
    # client_id: set via OAUTH_GITHUB_CLIENT_ID
    # client_secret: set via OAUTH_GITHUB_CLIENT_SECRET
    redirect_url: /api/v1/auth/oauth/github/callback
  microsoft:
    # client_id: set via OAUTH_MICROSOFT_CLIENT_ID
    # client_secret: set via OAUTH_MICROSOFT_CLIENT_SECRET
    redirect_url: /api/v1/auth/oauth/microsoft/callback

storage:
  provider: s3
  s3:
    # bucket: set via S3_BUCKET
    # region: set via S3_REGION
    # access_key_id: set via S3_ACCESS_KEY_ID
    # secret_access_key: set via S3_SECRET_ACCESS_KEY
    use_path_style: false

worker:
  concurrency: 20
  queues:
    - critical
    - default
    - low
  strict_priority: true
  shutdown_timeout: 60s
  health_check_interval: 15s
  retry_limit: 5

scheduler:
  enabled: true
  poll_interval: 10s
  lock_ttl: 30s
  batch_size: 100
  leader_election: true

websocket:
  enabled: true
  ping_interval: 30s
  pong_timeout: 10s
  write_timeout: 10s
  read_buffer_size: 2048
  write_buffer_size: 2048
  max_message_size: 1048576  # 1MB

crypto:
  # encryption_key: set via CRYPTO_ENCRYPTION_KEY (32 bytes for AES-256)
  # signing_key: set via CRYPTO_SIGNING_KEY

features:
  webhook_stream:
    enabled: true
    max_len: 500000
    batch_size: 50
    max_retries: 5
    consumer_count: 5
  rate_limit:
    enabled: true
    requests_per_minute: 300
    burst_size: 50
  execution:
    default_timeout: 600
    max_retries: 5
    worker_count: 20
    queue_size: 5000

metrics:
  enabled: true
  path: /metrics

resilience:
  circuit_breaker:
    enabled: true
    max_requests: 10
    interval: 10s
    timeout: 60s
    failure_threshold: 10
  retry:
    max_attempts: 5
    initial_interval: 100ms
    max_interval: 30s
    multiplier: 2.0
  rate_limit:
    enabled: true
    rate: 200.0
    burst: 50
