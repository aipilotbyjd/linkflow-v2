# =============================================================================
# LinkFlow Configuration
# =============================================================================
# This file contains NON-SENSITIVE configuration defaults only.
# All secrets MUST be set via environment variables.
#
# Priority (highest to lowest):
#   1. Environment variables
#   2. Environment-specific config (config.{env}.yaml)
#   3. This file (config.yaml)
#   4. Code defaults
#
# See .env.example for all available environment variables.
# =============================================================================

# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
app:
  name: linkflow
  environment: development            # development, staging, production, test
  debug: true                         # Enable debug mode (disable in production)
  url: http://localhost:8080          # Public URL of the API
  frontend_url: http://localhost:3000,http://localhost:5173 # Frontend application URL (comma-separated for multiple origins)
  execution_retention_days: 30        # Days to keep execution history
  graceful_shutdown_delay: 5s         # Delay before shutdown to drain connections

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server:
  host: 0.0.0.0
  port: 8090
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 30s
  max_header_bytes: 1048576           # 1MB

# -----------------------------------------------------------------------------
# Database (PostgreSQL)
# -----------------------------------------------------------------------------
database:
  host: localhost
  port: 5432
  user: postgres
  # password: set via DATABASE_PASSWORD or DATABASE_URL
  name: linkflow
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  slow_query_threshold: 200ms
  log_queries: false                  # Enable for debugging

# -----------------------------------------------------------------------------
# Redis
# -----------------------------------------------------------------------------
redis:
  host: localhost
  port: 6379
  # password: set via REDIS_PASSWORD or REDIS_URL
  db: 0
  tls: false                          # Use true for cloud Redis
  pool_size: 10
  min_idle_conns: 5
  max_retries: 3
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s
  max_conn_age: 0s                    # 0 = no max age
  cluster_mode: false
  # cluster_addrs: []                 # For cluster mode
  # sentinel_master: ""               # For sentinel mode
  # sentinel_addrs: []

# -----------------------------------------------------------------------------
# JWT
# -----------------------------------------------------------------------------
jwt:
  # secret: REQUIRED - set via JWT_SECRET (min 32 chars)
  access_expiry: 15m
  refresh_expiry: 168h                # 7 days
  issuer: linkflow
  signing_method: HS256
  refresh_token_rotation: true
  refresh_token_reuse_limit: 0        # 0 = single use

# -----------------------------------------------------------------------------
# OAuth
# -----------------------------------------------------------------------------
oauth:
  google:
    # client_id: set via OAUTH_GOOGLE_CLIENT_ID
    # client_secret: set via OAUTH_GOOGLE_CLIENT_SECRET
    redirect_url: /api/v1/auth/oauth/google/callback
    scopes:
      - email
      - profile
  github:
    # client_id: set via OAUTH_GITHUB_CLIENT_ID
    # client_secret: set via OAUTH_GITHUB_CLIENT_SECRET
    redirect_url: /api/v1/auth/oauth/github/callback
    scopes:
      - user:email
      - read:user
  microsoft:
    # client_id: set via OAUTH_MICROSOFT_CLIENT_ID
    # client_secret: set via OAUTH_MICROSOFT_CLIENT_SECRET
    redirect_url: /api/v1/auth/oauth/microsoft/callback
    scopes:
      - User.Read
      - email

# -----------------------------------------------------------------------------
# S3 / Object Storage
# -----------------------------------------------------------------------------
s3:
  # endpoint: set via S3_ENDPOINT (leave empty for AWS S3)
  region: us-east-1
  bucket: linkflow
  # access_key_id: set via S3_ACCESS_KEY_ID
  # secret_access_key: set via S3_SECRET_ACCESS_KEY
  use_ssl: true
  path_style: false                   # true for MinIO
  presigned_expiry: 15m
  upload_part_size: 5242880           # 5MB
  max_upload_parts: 10000

# -----------------------------------------------------------------------------
# Stripe
# -----------------------------------------------------------------------------
stripe:
  # secret_key: set via STRIPE_SECRET_KEY
  # webhook_secret: set via STRIPE_WEBHOOK_SECRET
  # publishable_key: set via STRIPE_PUBLISHABLE_KEY
  webhook_tolerance: 300s

# -----------------------------------------------------------------------------
# SMTP / Email
# -----------------------------------------------------------------------------
smtp:
  # host: set via SMTP_HOST
  port: 587
  # username: set via SMTP_USERNAME
  # password: set via SMTP_PASSWORD
  # from: set via SMTP_FROM
  from_name: LinkFlow
  use_tls: true
  insecure_skip_verify: false
  connection_timeout: 30s

# -----------------------------------------------------------------------------
# Queue (Asynq)
# -----------------------------------------------------------------------------
queue:
  concurrency: 10
  strict_priority: false
  shutdown_timeout: 30s
  health_check_interval: 15s
  retry_limit: 3
  retry_delay: 10s
  retention: 24h
  queues:
    critical: 6
    default: 3
    low: 1

# -----------------------------------------------------------------------------
# Encryption (for credentials storage)
# -----------------------------------------------------------------------------
encryption:
  # key: set via ENCRYPTION_KEY (32 chars for AES-256)
  algorithm: aes-256-gcm
  key_rotation: false
  # old_keys: []                      # For key rotation

# -----------------------------------------------------------------------------
# Tracing (OpenTelemetry)
# -----------------------------------------------------------------------------
tracing:
  enabled: false
  provider: otlp                      # otlp, jaeger, zipkin
  # endpoint: set via TRACING_ENDPOINT
  service_name: linkflow
  sample_rate: 0.1                    # 10% of requests
  insecure: false

# -----------------------------------------------------------------------------
# Circuit Breaker
# -----------------------------------------------------------------------------
circuit_breaker:
  enabled: true
  threshold: 5                        # Failures before opening
  timeout: 30s                        # Time before half-open
  max_requests: 100                   # Requests in half-open state
  interval: 60s                       # Interval for counting failures
  on_state_change: true               # Log state changes

# -----------------------------------------------------------------------------
# Retry Policy
# -----------------------------------------------------------------------------
retry:
  max_attempts: 3
  initial_interval: 100ms
  max_interval: 10s
  multiplier: 2.0
  randomize_factor: 0.5

# -----------------------------------------------------------------------------
# Rate Limiting
# -----------------------------------------------------------------------------
rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200
  by_ip: true
  by_user: true
  exclude_paths:
    - /health
    - /ready
    - /live
    - /metrics

# -----------------------------------------------------------------------------
# CORS
# -----------------------------------------------------------------------------
cors:
  enabled: true
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-Request-ID
    - X-Workspace-ID
  exposed_headers:
    - X-Request-ID
  allow_credentials: true
  max_age: 86400                      # 24 hours

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: info                         # trace, debug, info, warn, error, fatal
  format: json                        # json, console, text
  output: stdout                      # stdout, stderr, file
  file: ""                            # Path when output is 'file'
  max_size: 100                       # MB
  max_backups: 3
  max_age: 28                         # Days
  compress: true
  include_caller: false
  redact_secrets: true

# -----------------------------------------------------------------------------
# Metrics (Prometheus)
# -----------------------------------------------------------------------------
metrics:
  enabled: true
  path: /metrics
  namespace: linkflow
  subsystem: api
  enable_runtime_metrics: true
  enable_db_metrics: true
  enable_http_metrics: true

# -----------------------------------------------------------------------------
# Health Checks
# -----------------------------------------------------------------------------
health:
  path: /health
  ready_path: /ready
  live_path: /live
  detailed_response: false            # Include component status
  include_db_check: true
  include_redis_check: true
  timeout: 5s

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
features:
  webhook_stream:
    enabled: true
    max_len: 100000                   # Max messages in stream
    dlq_max_len: 10000                # Max messages in dead letter queue
    batch_size: 10                    # Messages per batch
    max_retries: 3                    # Before moving to DLQ
    stale_timeout: 300                # Seconds before message is stale
    consumer_count: 2                 # Consumer goroutines
    processing_timeout: 30s

  execution:
    max_concurrent: 100               # Max concurrent executions
    default_timeout: 300s             # 5 minutes
    max_timeout: 3600s                # 1 hour
    retention_days: 30
    cleanup_interval: 1h
    max_payload_size: 10485760        # 10MB
