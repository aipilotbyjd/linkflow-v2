# =============================================================================
# LinkFlow Production Environment Configuration
# =============================================================================
# Production environment - maximum security and performance
# All secrets MUST be set via environment variables
# =============================================================================

app:
  name: linkflow
  environment: production
  debug: false
  url: https://api.linkflow.ai
  frontend_url: https://app.linkflow.ai
  cors_origins:
    - https://app.linkflow.ai

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  host: ${DATABASE_HOST}
  port: 5432
  user: ${DATABASE_USER}
  name: linkflow_prod
  sslmode: require
  max_open_conns: 50
  max_idle_conns: 25
  max_lifetime: 30m

redis:
  host: ${REDIS_HOST}
  port: 6379
  db: 0
  pool_size: 25

jwt:
  access_expiry: 15m
  refresh_expiry: 168h
  issuer: linkflow

email:
  provider: sendgrid
  from: noreply@linkflow.ai
  from_name: LinkFlow

storage:
  provider: s3
  s3:
    bucket: linkflow-prod
    region: us-east-1
    use_path_style: false

worker:
  concurrency: 20
  queues:
    - critical
    - default
    - low
  strict_priority: true
  shutdown_timeout: 60s
  health_check_interval: 15s
  retry_limit: 3

scheduler:
  enabled: true
  poll_interval: 10s
  lock_ttl: 30s
  batch_size: 100
  leader_election: true

websocket:
  enabled: true
  ping_interval: 30s
  pong_timeout: 10s
  write_timeout: 10s
  read_buffer_size: 2048
  write_buffer_size: 2048
  max_message_size: 1048576

features:
  webhook_stream:
    enabled: true
    max_len: 100000
    batch_size: 10
    max_retries: 3
    consumer_count: 4
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst_size: 20
  execution:
    default_timeout: 300
    max_retries: 3
    worker_count: 20
    queue_size: 2000

metrics:
  enabled: true
  port: 9090
  path: /metrics

resilience:
  circuit_breaker:
    enabled: true
    max_requests: 10
    interval: 10s
    timeout: 60s
    failure_threshold: 5
  retry:
    max_attempts: 3
    initial_interval: 100ms
    max_interval: 10s
    multiplier: 2.0
  rate_limit:
    enabled: true
    rate: 100.0
    burst: 20
