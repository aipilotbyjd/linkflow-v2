groups:
  - name: database
    rules:
      # Database is down
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "Database has been down for more than 1 minute"

      # High connection count (>80% of max)
      - alert: HighConnectionCount
        expr: |
          pg_stat_activity_count 
          / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connection count"
          description: "{{ $value | humanizePercentage }} of max connections used"

      # Slow queries
      - alert: SlowQueries
        expr: |
          rate(pg_stat_activity_max_tx_duration{state="active"}[5m]) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow queries detected"
          description: "Queries running longer than 60 seconds"

      # Database size growing fast
      - alert: DatabaseSizeGrowing
        expr: |
          delta(pg_database_size_bytes[1h]) > 100000000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Database size growing rapidly"
          description: "Database grew by {{ $value | humanize1024 }} in the last hour"

      # Redis is down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"

      # Redis high memory
      - alert: RedisHighMemory
        expr: |
          redis_memory_used_bytes 
          / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"
