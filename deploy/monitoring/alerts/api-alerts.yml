groups:
  - name: api
    rules:
      # API is down
      - alert: APIDown
        expr: up{job="linkflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LinkFlow API is down"
          description: "API has been down for more than 1 minute"

      # High error rate (>5% of requests)
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="linkflow-api",status=~"5.."}[5m])) 
          / sum(rate(http_requests_total{job="linkflow-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }}"

      # High latency (p95 > 2s)
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, 
            sum(rate(http_request_duration_seconds_bucket{job="linkflow-api"}[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "95th percentile latency is {{ $value | humanizeDuration }}"

      # High memory usage (>85%)
      - alert: HighMemoryUsage
        expr: |
          container_memory_usage_bytes{name=~".*api.*"} 
          / container_spec_memory_limit_bytes{name=~".*api.*"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # High CPU usage (>80%)
      - alert: HighCPUUsage
        expr: |
          rate(container_cpu_usage_seconds_total{name=~".*api.*"}[5m]) 
          / container_spec_cpu_quota{name=~".*api.*"} * 100000 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      # Too many goroutines
      - alert: TooManyGoroutines
        expr: go_goroutines{job="linkflow-api"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many goroutines"
          description: "{{ $value }} goroutines running"
