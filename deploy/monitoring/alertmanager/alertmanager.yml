global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@linkflow.io'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h
    
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 4h

receivers:
  - name: 'default'
    email_configs:
      - to: 'team@linkflow.io'

  - name: 'critical'
    email_configs:
      - to: 'oncall@linkflow.io'
    # Uncomment for Slack
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#alerts-critical'
    #     send_resolved: true

  - name: 'warning'
    email_configs:
      - to: 'team@linkflow.io'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
