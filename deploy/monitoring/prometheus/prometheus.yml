global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # LinkFlow API
  - job_name: 'linkflow-api'
    static_configs:
      - targets: ['api:8090']
    metrics_path: /metrics

  # LinkFlow Worker
  - job_name: 'linkflow-worker'
    static_configs:
      - targets: ['worker:8091']
    metrics_path: /metrics

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Node metrics (if node-exporter is running)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
