global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'linkflow-api'
    static_configs:
      - targets: ['api:8090']
    metrics_path: /metrics/prometheus
    scrape_interval: 15s

  - job_name: 'linkflow-worker'
    static_configs:
      - targets: ['worker:8090']
    metrics_path: /metrics/prometheus
    scrape_interval: 15s

  - job_name: 'linkflow-scheduler'
    static_configs:
      - targets: ['scheduler:8091']
    metrics_path: /metrics/prometheus
    scrape_interval: 15s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
