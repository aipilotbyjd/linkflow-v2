# ============================================================================
# Fly.io Configuration
# Deploy: fly deploy --app linkflow-<env>
# ============================================================================

app = "linkflow"
primary_region = "sjc"

[build]
  dockerfile = "deploy/docker/Dockerfile"

[build.args]
  SERVICE = "api"

[env]
  PORT = "8090"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = "rolling"

[[services]]
  protocol = "tcp"
  internal_port = 8090

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
