apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkflow-api
  namespace: linkflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkflow-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: linkflow-api
    spec:
      containers:
        - name: api
          image: linkflow/api:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: linkflow-config
            - secretRef:
                name: linkflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
