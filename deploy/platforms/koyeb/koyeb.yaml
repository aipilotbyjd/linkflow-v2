# ============================================================================
# Koyeb Configuration
# Deploy: koyeb app create linkflow --config deploy/platforms/koyeb/koyeb.yaml
# ============================================================================

name: linkflow-api
type: web

docker:
  dockerfile: deploy/docker/Dockerfile
  build_args:
    SERVICE: api

ports:
  - port: 8090
    protocol: http

routes:
  - path: /
    port: 8090

scaling:
  min: 1
  max: 1

instance_types:
  - free

regions:
  - fra

health_checks:
  - port: 8090
    protocol: http
    path: /api/v1/health
    interval: 30
    timeout: 5
    healthy_threshold: 2
    unhealthy_threshold: 3
