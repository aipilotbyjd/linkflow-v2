# ============================================================================
# Koyeb Multi-Service Configuration
# Deployment: koyeb app create linkflow --config deploy/platforms/koyeb/koyeb.yaml
# ============================================================================

name: linkflow

services:
  # ------------------------ API ------------------------
  - name: api
    type: web
    docker:
      dockerfile: deploy/docker/Dockerfile
      build_args:
        SERVICE: api
    ports:
      - port: 8090
        protocol: http
    routes:
      - path: /
        port: 8090
    scaling:
      min: 1
      max: 1
    instance_types:
      - free
    regions:
      - fra
    health_checks:
      - port: 8090
        protocol: http
        path: /api/v1/health

  # ------------------------ WORKER ------------------------
  - name: worker
    type: worker
    docker:
      dockerfile: deploy/docker/Dockerfile
      build_args:
        SERVICE: worker
    scaling:
      min: 1
      max: 1
    instance_types:
      - free
    regions:
      - fra

  # ------------------------ SCHEDULER ------------------------
  - name: scheduler
    type: worker
    docker:
      dockerfile: deploy/docker/Dockerfile
      build_args:
        SERVICE: scheduler
    scaling:
      min: 1  # Leadership election requires at least 1, but keep it 1 to avoid conflicts
      max: 1
    instance_types:
      - free
    regions:
      - fra
