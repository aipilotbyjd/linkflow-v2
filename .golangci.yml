run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - gosec
    - bodyclose
    - noctx
    - sqlclosecheck
    - exportloopref
    - gocritic
    - revive
    - prealloc

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (io.Closer).Close
      - (*encoding/json.Encoder).Encode
      - (github.com/linkflow-ai/linkflow/internal/shared/events.Bus).Publish
      - (*github.com/linkflow-ai/linkflow/internal/infrastructure/cache.Cache).Delete

  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow  # Too noisy, common Go patterns trigger this

  goimports:
    local-prefixes: github.com/linkflow-ai/linkflow-v2

  misspell:
    locale: US

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - hugeParam
      - rangeValCopy
      - ifElseChain
      - unnamedResult
      - sprintfQuotedString

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
        disabled: true  # Too noisy for stuttering names
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
        disabled: true
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

  gosec:
    excludes:
      - G104 # Unhandled errors (too noisy)
      - G505 # sha1 required for TOTP (RFC 6238)
      - G101 # False positives on variable names containing "token", "credential"
      - G115 # Integer overflow - handled by application logic

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gocritic

    - path: cmd/
      linters:
        - gochecknoinits

    # Exclude common non-fatal error checks
    - linters:
        - errcheck
      text: "Error return value of .*(Write|Close|Expire|Release|Delete|Del|SetReadDeadline|SetWriteDeadline|Unmarshal).* is not checked"

    # Empty branches are often intentional
    - linters:
        - staticcheck
      text: "SA9003"

  max-issues-per-linter: 50
  max-same-issues: 10
